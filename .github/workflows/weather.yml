name: weather
on:
  schedule:
    - cron: "12 * * * *"   # 매시 12분(UTC) — best-effort(누락 가능) · 앱은 6시간 낡으면 폴백
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: weather, cancel-in-progress: false }
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: fetch
        env: { KMA_KEY: "${{ secrets.KMA_KEY }}" }
        run: python3 fetch_kma.py
      - name: commit
        run: |
          git config user.name "weather-bot"
          git config user.email "weather-bot@users.noreply.github.com"
          git add weather.json
          git diff --cached --quiet || git commit -m "weather $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
